services:
  paperless-ngx:
    # Shipyard: route all HTTP traffic for this environment to this service.
    labels:
      shipyard.route: '/'
    build: .
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      # Must live in `environment:`, NOT env_file: on Shipyard the env_file (.env)
      # vars are not injected for this service (the DB/Redis vars above are, which is
      # why Postgres/Redis connect), so the secret has to be inline here. THROWAWAY
      # dev value — regenerate for any real use.
      PAPERLESS_SECRET_KEY: dev-throwaway-secret-shipyard-eval-do-not-use-in-prod-0123456789
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
