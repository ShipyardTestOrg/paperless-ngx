# Generated by curious
services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    env_file:
      - ./.env
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_PORT: "8000"
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
    ports:
      - 8000:8000
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      shipyard.route: /
      shipyard.primary-route: "true"
  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
      POSTGRES_DB: paperless
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U paperless -d paperless
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping | grep PONG
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "6379"
volumes:
  data:
    labels:
      shipyard.deploy.disk.size: 2Gi
  media:
    labels:
      shipyard.deploy.disk.size: 2Gi
  pgdata:
    labels:
      shipyard.deploy.disk.size: 5Gi
  redisdata:
    labels:
      shipyard.deploy.disk.size: 1Gi
